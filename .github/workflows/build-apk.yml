name: Build APK

on:
  workflow_dispatch:

env:
  VERSION: v0.8.1

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle and load from cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFossRelease --no-daemon --parallel --build-cache --configuration-cache

      - name: Rename APK
        run: mv app/build/outputs/apk/foss/release/*.apk app/build/outputs/apk/foss/release/internetradio-${VERSION}.apk

      - name: Upload release APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: app/build/outputs/apk/foss/release/internetradio-${{ env.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
